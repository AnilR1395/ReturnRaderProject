<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="hmBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="mistGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="hmDrop">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#hmBg)"/>

  <!-- Cool Mist Vapor Effect -->
  <path d="M 200 80 Q 185 50 205 30 Q 220 15 200 5" fill="none" stroke="url(#mistGlow)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 210 75 Q 230 45 215 25" fill="none" stroke="url(#mistGlow)" stroke-width="5" stroke-linecap="round"/>

  <g transform="translate(125, 75)" filter="url(#hmDrop)">
    <!-- Base Chassis -->
    <path d="M 20 250 C 15 200 20 130 30 110 L 120 110 C 130 130 135 200 130 250 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <ellipse cx="75" cy="250" rx="55" ry="14" fill="#0F172A" stroke="#334155" stroke-width="2"/>

    <!-- Water Tank Top (Semi-transparent with water inside) -->
    <path d="M 30 110 C 35 45 115 45 120 110 Z" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="2"/>
    
    <!-- Water level line inside tank -->
    <path d="M 33 100 Q 75 90 117 100" fill="none" stroke="#38BDF8" stroke-width="2"/>

    <!-- Mist Nozzle on top -->
    <rect x="70" y="38" width="10" height="12" rx="3" fill="#0284C7"/>

    <!-- Digital Touch Control & Humidity Meter -->
    <circle cx="75" cy="180" r="28" fill="#020617" stroke="#38BDF8" stroke-width="2"/>
    <text x="75" y="178" font-family="monospace" font-size="14" font-weight="900" fill="#38BDF8" text-anchor="middle">55%</text>
    <text x="75" y="194" font-family="monospace" font-size="7" font-weight="700" fill="#10B981" text-anchor="middle">HUMIDITY</text>
    
    <!-- Power & Mist Level Touch Buttons -->
    <circle cx="50" cy="225" r="5" fill="#0284C7"/>
    <circle cx="75" cy="225" r="5" fill="#38BDF8"/>
    <circle cx="100" cy="225" r="5" fill="#64748B"/>
    
    <text x="75" y="140" font-family="-apple-system, sans-serif" font-size="7" font-weight="900" fill="#64748B" text-anchor="middle" letter-spacing="1">ULTRASONIC 4.5L</text>
  </g>

  <!-- Badge -->
  <rect x="24" y="24" width="200" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="124" y="41" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">Smart Mist Room Humidifier</text>
</svg>
