<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="kdBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="kdDrop">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#kdBg)"/>

  <g transform="translate(115, 60)" filter="url(#kdDrop)">
    <!-- Outer Kindle Bezel Chassis -->
    <rect x="10" y="10" width="150" height="230" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2"/>

    <!-- Paper-like E-Ink Screen -->
    <rect x="22" y="22" width="126" height="190" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Book Title & Progress bar inside screen -->
    <text x="85" y="42" font-family="serif" font-size="8" font-style="italic" fill="#64748B" text-anchor="middle">Chapter 12 — The Horizon</text>
    <line x1="30" y1="48" x2="140" y2="48" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Book Paragraph Lines Graphic -->
    <line x1="30" y1="65" x2="138" y2="65" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="30" y1="78" x2="140" y2="78" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="30" y1="91" x2="135" y2="91" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="30" y1="104" x2="140" y2="104" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="30" y1="117" x2="110" y2="117" stroke="#1E293B" stroke-width="2.5"/>

    <line x1="30" y1="135" x2="140" y2="135" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="30" y1="148" x2="136" y2="148" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="30" y1="161" x2="140" y2="161" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="30" y1="174" x2="90" y2="174" stroke="#1E293B" stroke-width="2.5"/>

    <!-- Reading Progress Footer -->
    <text x="32" y="202" font-family="monospace" font-size="7" fill="#64748B">Page 184</text>
    <text x="138" y="202" font-family="monospace" font-size="7" fill="#64748B" text-anchor="end">68%</text>

    <!-- Kindle Subtle Logo at Bottom Bezel -->
    <text x="85" y="228" font-family="-apple-system, sans-serif" font-size="8" font-weight="900" fill="#475569" text-anchor="middle" letter-spacing="1">kindle</text>
  </g>

  <!-- Badge -->
  <rect x="24" y="24" width="200" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="124" y="41" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">Kindle Paperwhite 16GB</text>
</svg>
