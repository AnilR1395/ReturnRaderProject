<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="btBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="flaskBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <linearGradient id="capSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="btDrop">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#btBg)"/>

  <g transform="translate(145, 60)" filter="url(#btDrop)">
    <!-- Main Cylinder Flask -->
    <rect x="20" y="80" width="70" height="200" rx="16" fill="url(#flaskBody)" stroke="#0284C7" stroke-width="1.5"/>
    
    <!-- Base Pad -->
    <rect x="22" y="260" width="66" height="18" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>

    <!-- Bottle Neck -->
    <path d="M 30 80 C 30 65 40 50 42 45 L 68 45 C 70 50 80 65 80 80 Z" fill="url(#flaskBody)" stroke="#0284C7" stroke-width="1.5"/>

    <!-- Steel Cap Collar -->
    <rect x="40" y="32" width="30" height="15" rx="3" fill="url(#capSteel)" stroke="#94A3B8" stroke-width="1"/>

    <!-- Bottle Handle / Loop Lid -->
    <path d="M 46 32 C 46 15 64 15 64 32" fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
    <path d="M 46 32 C 46 15 64 15 64 32" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

    <!-- Powder Coat Texture Graphic & Capacity Tag -->
    <text x="55" y="145" font-family="-apple-system, sans-serif" font-size="9" font-weight="900" fill="#E0F2FE" text-anchor="middle" letter-spacing="1">MILTON</text>
    <text x="55" y="160" font-family="monospace" font-size="7" font-weight="700" fill="#BAE6FD" text-anchor="middle">THERMOSTEEL</text>
    <rect x="38" y="175" width="34" height="14" rx="4" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1"/>
    <text x="55" y="185" font-family="monospace" font-size="7" font-weight="900" fill="#38BDF8" text-anchor="middle">1000 ML</text>
    
    <!-- Temperature retention icons -->
    <text x="55" y="215" font-family="-apple-system, sans-serif" font-size="8" fill="#F0F9FF" text-anchor="middle">❄️ 24h Cold</text>
    <text x="55" y="230" font-family="-apple-system, sans-serif" font-size="8" fill="#F0F9FF" text-anchor="middle">🔥 24h Hot</text>
  </g>

  <!-- Badge -->
  <rect x="24" y="24" width="190" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="119" y="41" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">Milton Thermosteel 1000ml</text>
</svg>
