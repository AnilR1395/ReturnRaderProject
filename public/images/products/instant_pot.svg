<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="ipBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="cookerSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="ipDrop">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#ipBg)"/>

  <g transform="translate(110, 70)" filter="url(#ipDrop)">
    <!-- Side Grip Handles Left & Right -->
    <path d="M 10 130 C -8 130 -8 165 10 165 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <path d="M 170 130 C 188 130 188 165 170 165 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>

    <!-- Main Outer Body Cylinder -->
    <path d="M 15 110 L 15 220 C 15 240 165 240 165 220 L 165 110 Z" fill="url(#cookerSteel)" stroke="#475569" stroke-width="2"/>
    <ellipse cx="90" cy="225" rx="75" ry="18" fill="#0F172A" stroke="#334155" stroke-width="2"/>

    <!-- High-Tech Digital Control Panel Box (Instant Pot Style) -->
    <rect x="50" y="125" width="80" height="85" rx="10" fill="#020617" stroke="#38BDF8" stroke-width="1.5"/>
    
    <!-- LED Digital Display -->
    <rect x="58" y="132" width="64" height="26" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="90" y="150" font-family="monospace" font-size="13" font-weight="900" fill="#EF4444" text-anchor="middle">00:30</text>
    <text x="90" y="140" font-family="monospace" font-size="6" font-weight="700" fill="#10B981" text-anchor="middle">PRESSURE COOK</text>

    <!-- Buttons Grid -->
    <rect x="58" y="165" width="18" height="8" rx="2" fill="#1E293B"/>
    <text x="67" y="171" font-family="monospace" font-size="5" fill="#CBD5E1" text-anchor="middle">SOUP</text>
    
    <rect x="81" y="165" width="18" height="8" rx="2" fill="#1E293B"/>
    <text x="90" y="171" font-family="monospace" font-size="5" fill="#CBD5E1" text-anchor="middle">RICE</text>

    <rect x="104" y="165" width="18" height="8" rx="2" fill="#1E293B"/>
    <text x="113" y="171" font-family="monospace" font-size="5" fill="#CBD5E1" text-anchor="middle">YOGURT</text>

    <rect x="70" y="182" width="40" height="12" rx="3" fill="#0284C7"/>
    <text x="90" y="190" font-family="monospace" font-size="6" font-weight="900" fill="#FFFFFF" text-anchor="middle">START</text>

    <text x="90" y="204" font-family="-apple-system, sans-serif" font-size="6" font-weight="900" fill="#94A3B8" text-anchor="middle" letter-spacing="1">INSTANT POT DUO</text>

    <!-- Locking Lid with Steam Release Valve -->
    <path d="M 20 110 C 20 60 160 60 160 110 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="80" y="48" width="20" height="18" rx="4" fill="#334155" stroke="#64748B" stroke-width="1"/>
    <!-- Steam vent valve -->
    <circle cx="120" cy="72" r="6" fill="#EF4444"/>
    <line x1="120" y1="62" x2="120" y2="72" stroke="#EF4444" stroke-width="2"/>
  </g>

  <!-- Badge -->
  <rect x="24" y="24" width="200" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="124" y="41" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">Instant Pot 7-in-1 Cooker</text>
</svg>
