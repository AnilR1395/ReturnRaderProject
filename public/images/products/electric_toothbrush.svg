<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="tbBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="brushWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="tbDrop">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#tbBg)"/>

  <g transform="translate(155, 45)" filter="url(#tbDrop)">
    <!-- Wireless Charging Dock Base -->
    <ellipse cx="45" cy="305" rx="42" ry="14" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <ellipse cx="45" cy="300" rx="36" ry="10" fill="#1E293B"/>

    <!-- Handle Body -->
    <rect x="30" y="115" width="30" height="180" rx="14" fill="url(#brushWhite)" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Rubber Grip Panels -->
    <rect x="36" y="140" width="18" height="50" rx="6" fill="#0284C7"/>
    
    <!-- Power Button -->
    <circle cx="45" cy="155" r="5" fill="#FFFFFF" stroke="#0369A1" stroke-width="1.5"/>
    <path d="M 45 152 L 45 156" stroke="#0369A1" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Battery & Pressure Sensor Indicators -->
    <circle cx="45" cy="245" r="2.5" fill="#10B981"/>
    <rect x="42" y="260" width="6" height="10" rx="1" fill="#0284C7"/>

    <!-- Brush Neck Stem -->
    <rect x="42" y="55" width="6" height="60" rx="2" fill="url(#brushWhite)" stroke="#94A3B8" stroke-width="1"/>

    <!-- Round Oscillating Brush Head (Oral-B Style) -->
    <circle cx="45" cy="45" r="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Bristles details -->
    <circle cx="45" cy="45" r="10" fill="#0284C7"/>
    <circle cx="45" cy="45" r="5" fill="#38BDF8"/>
    <circle cx="45" cy="45" r="2" fill="#FFFFFF"/>
    
    <!-- 2 Min Quadpacer Timer Tag -->
    <rect x="18" y="210" width="54" height="14" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="45" y="220" font-family="monospace" font-size="7" font-weight="900" fill="#38BDF8" text-anchor="middle">2 MIN TIMER</text>
  </g>

  <!-- Badge -->
  <rect x="24" y="24" width="190" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="119" y="41" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">Oral-B Pro Electric Toothbrush</text>
</svg>
