<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="crBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="clogNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="60%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="crDrop">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#crBg)"/>

  <g transform="translate(90, 110)" filter="url(#crDrop)">
    <!-- Heel Strap -->
    <path d="M 60 110 C 20 100 20 60 45 50 C 65 40 100 65 95 105" fill="none" stroke="#1E3A8A" stroke-width="14" stroke-linecap="round"/>
    <circle cx="60" cy="110" r="8" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
    <circle cx="60" cy="110" r="3" fill="#000000"/>

    <!-- Main Clog Outsole & Upper -->
    <path d="M 35 125 C 20 120 40 90 70 80 C 120 60 170 80 200 110 C 220 130 220 155 190 165 C 150 175 70 170 45 160 C 30 150 25 135 35 125 Z" fill="url(#clogNavy)" stroke="#3B82F6" stroke-width="2"/>

    <!-- Thick Cushioned Sole Profile -->
    <path d="M 35 155 C 65 165 145 170 190 160 C 185 175 140 185 90 180 C 50 175 30 168 35 155 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Ventilation Holes Pattern (Crocs Iconic Holes) -->
    <ellipse cx="140" cy="105" rx="5" ry="4" fill="#0F172A"/>
    <ellipse cx="160" cy="110" rx="5" ry="4" fill="#0F172A"/>
    <ellipse cx="180" cy="122" rx="5" ry="4" fill="#0F172A"/>

    <ellipse cx="130" cy="120" rx="5" ry="4" fill="#0F172A"/>
    <ellipse cx="150" cy="125" rx="5" ry="4" fill="#0F172A"/>
    <ellipse cx="170" cy="135" rx="5" ry="4" fill="#0F172A"/>

    <ellipse cx="120" cy="135" rx="5" ry="4" fill="#0F172A"/>
    <ellipse cx="140" cy="142" rx="5" ry="4" fill="#0F172A"/>
    <ellipse cx="160" cy="148" rx="5" ry="4" fill="#0F172A"/>

    <!-- Brand Tag -->
    <text x="120" y="72" font-family="-apple-system, sans-serif" font-size="9" font-weight="900" fill="#93C5FD" letter-spacing="1">CROCS CLASSIC</text>
  </g>

  <!-- Badge -->
  <rect x="24" y="24" width="200" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="124" y="41" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">Crocs Classic All-Day Clogs</text>
</svg>
